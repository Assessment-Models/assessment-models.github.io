name: Deploy gateway to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # Registry sync commits are pushed by the bot with GITHUB_TOKEN, which does
    # not fire `push` events - rebuild and redeploy when the sync completes,
    # so /data/ecosystem-registry.json and the dist bundle stay current.
    workflows: ["Sync Assessment-Models Ecosystem Registry"]
    types: [completed]
  schedule:
    # weekly refresh so the constellation reflects org-side changes
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run fires on any conclusion - only redeploy when the triggering
    # registry sync actually succeeded (push/dispatch/schedule always proceed).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ecosystem data sources
        uses: actions/checkout@v4
        with:
          repository: Assessment-Models/assessment-registry
          path: sources/assessment-registry
      - uses: actions/checkout@v4
        with:
          repository: Assessment-Models/maturity-model-standard
          path: sources/maturity-model-standard
      - name: Checkout maturity-model repos (for offline snapshots)
        run: |
          for repo in maturity-model-digital-transformation maturity-model-digital-transformation-operationalized maturity-model-autonomous-operations maturity-model-modernization maturity-model-operations maturity-model-services-delivery maturity-model-technology; do
            gh repo clone "Assessment-Models/$repo" "sources/$repo" -- --depth 1 --quiet 2>/dev/null || echo "clone skipped: $repo"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Validate homepage artifact links
        run: node scripts/validate-homepage-links.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint site text (no em/en dashes, portfolio facts vs registry)
        run: node scripts/lint-site-text.mjs
      - run: node scripts/build-index.mjs --registry sources/assessment-registry --standard sources/maturity-model-standard --models sources/maturity-model-digital-transformation --snapshot-root sources
      - run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
