name: Gateway validation

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "gateway/**"
      - "assets/**"
      - "data/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/gateway-validation.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint site text (no em/en dashes, portfolio facts vs registry)
        run: node scripts/lint-site-text.mjs
      - name: Scoring engine regression tests
        run: npm test
      - name: Production site build
        run: npm run build:site
