name: Sync Assessment-Models Ecosystem Registry

on:
  schedule:
    # Sync every 6 hours to keep GitHub Pages aligned with org repositories
    - cron: "0 */6 * * *"
  repository_dispatch:
    # Triggered by model repositories upon release or manifest update
    types: [model-released, manifest-updated]
  workflow_dispatch:
    # Manual refresh button in GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-catalog-sync"
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assessment-models.github.io
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: pip install --quiet jsonschema

      - name: Synchronize Assessment-Models repository catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_org_catalog.py

      - name: Commit updated ecosystem-registry.json if changed
        run: |
          git config user.name "assessment-models-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ecosystem-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(registry): sync Assessment-Models catalog [skip ci]"
            git push
          else
            echo "No catalog changes detected."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4