name: Sync Assessment-Models Ecosystem Registry

on:
  push:
    # Verify the sync liveness whenever its logic changes (runs the real sync
    # in CI and commits any registry drift; bot commits use [skip ci] so no
    # recursion). User pushes fire this trigger - GITHUB_TOKEN pushes do not.
    branches: [main]
    paths:
      - "scripts/sync_org_catalog.py"
      - ".github/workflows/sync-catalog.yml"
  schedule:
    # Sync every 6 hours to keep GitHub Pages aligned with org repositories
    - cron: "0 */6 * * *"
  repository_dispatch:
    # Triggered by model repositories upon release or manifest update
    types: [model-released, manifest-updated]
  workflow_dispatch:
    # Manual refresh button in GitHub Actions UI

permissions:
  contents: write
  issues: write

concurrency:
  group: "catalog-sync"
  cancel-in-progress: true

jobs:
  sync-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout assessment-models.github.io
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: pip install --quiet jsonschema

      - name: Synchronize Assessment-Models repository catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/sync_org_catalog.py 2>&1 | tee sync-output.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "## sync_org_catalog.py failed with exit code $rc"
              echo ""
              echo "Last output lines:"
              echo ""
              echo '```'
              tail -n 60 sync-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Surface the failure reason as annotations too: job summaries
            # need the web UI, but annotations are readable from the public
            # run page and the REST API without sign-in.
            grep -E '^\[(ERROR|DIAG|WARN)\]|Traceback|^Error:|CRASHED' sync-output.log | tail -n 10 > diag-lines.txt || true
            if [ -s diag-lines.txt ]; then
              while IFS= read -r line; do
                safe="${line//[\`\"]/}"
                safe="${safe//:/;}"
                echo "::error title=catalog-sync::${safe:0:240}"
              done < diag-lines.txt
            else
              echo "::error title=catalog-sync::sync failed with exit code $rc and printed no diagnostics; inspect the raw log"
            fi
          fi
          exit "$rc"

      # If the sync failed, probe API reachability so the run page summary
      # shows whether the fault is token authentication or the endpoint.
      - name: Diagnose GitHub API access (failure only)
        if: failure()
        env:
          GH_TOKEN_FOR_PROBE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## GitHub API probe (status codes only)"
            echo ""
            echo '```'
            echo -n "/rate_limit (authenticated):     "
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN_FOR_PROBE" \
              -H "User-Agent: assessment-models-catalog-sync/1.0" \
              https://api.github.com/rate_limit
            echo -n "/orgs/Assessment-Models/repos (authenticated): "
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN_FOR_PROBE" \
              -H "User-Agent: assessment-models-catalog-sync/1.0" \
              "https://api.github.com/orgs/Assessment-Models/repos?per_page=1"
            echo -n "/orgs/Assessment-Models/repos (anonymous):     "
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -H "User-Agent: assessment-models-catalog-sync/1.0" \
              "https://api.github.com/orgs/Assessment-Models/repos?per_page=1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Failure visibility: job logs and step summaries require sign-in, but
      # issues are readable by everyone. On failure, post the sync log tail
      # to a standing diagnostics issue so failures are diagnosable from
      # outside the Actions UI.
      - name: Report failure log to diagnostics issue (failure only)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = "https://api.github.com/repos/Assessment-Models/assessment-models.github.io"
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "assessment-models-catalog-sync/1.0",
          }

          def api(path, data=None, method=None):
              req = urllib.request.Request(
                  base + path,
                  headers=headers,
                  data=json.dumps(data).encode() if data is not None else None,
                  method=method or ("POST" if data is not None else "GET"),
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read() or b"null")

          title = "Catalog sync failed - diagnostics"
          log_tail = ""
          try:
              with open("sync-output.log", encoding="utf-8", errors="replace") as fh:
                  log_tail = fh.read()[-8000:]
          except OSError:
              log_tail = "(sync-output.log unavailable)"

          body = (
              "## Sync failure diagnostics\n\n"
              f"Workflow run: {os.environ.get('WORKFLOW_URL', '')}\n\n"
              "### Sync log tail\n\n```\n" + log_tail + "\n```\n"
          )

          existing = api("/issues?state=open&per_page=100")
          target = next(
              (i for i in existing if isinstance(i, dict) and i.get("title") == title),
              None,
          )
          if target and target.get("number"):
              api(
                  f"/issues/{target['number']}/comments",
                  {"body": body},
              )
              print(f"[OK] Commented on issue #{target['number']}")
          else:
              created = api("/issues", {"title": title, "body": body})
              print(f"[OK] Created issue #{created.get('number')}")
          PY

      # Coverage guardrail: surface every discovered repository, its layer,
      # version and manifest status so repos still missing an
      # assessment-manifest.json (or contracts) are immediately visible.
      - name: Print catalog coverage summary
        run: |
          python - <<'PY'
          import json

          with open("data/ecosystem-registry.json", encoding="utf-8") as fh:
              registry = json.load(fh)

          artifacts = registry.get("artifacts", [])
          endpoint_ids = {
              ep
              for key in ("touchpoints", "handshakes")
              for contract in registry.get(key, [])
              for ep in (contract.get("from_station_id"), contract.get("to_station_id"))
          }
          print(f"Coverage summary: {len(artifacts)} artifacts mapped\n")
          unmanifested, unlinked = [], []
          for art in artifacts:
              has_manifest = bool(art.get("has_manifest"))
              linked = art.get("id") in endpoint_ids
              flag = "manifest" if has_manifest else "NO-MANIFEST"
              link_flag = "contracts" if linked else "NO-CONTRACTS"
              print(f"  {art['full_name']:<58} {art.get('layer', '?'):<20} "
                    f"{art.get('version', '?'):<14} {flag} {link_flag} ({art.get('conformance_status', '?')})")
              if not has_manifest:
                  unmanifested.append(art["full_name"])
              if not linked:
                  unlinked.append(art["full_name"])

          print(f"\nRepos needing assessment-manifest.json: {len(unmanifested)}")
          for name in unmanifested:
              print(f"  - {name}")
          print(f"Repos needing touchpoints/handshakes: {len(unlinked)}")
          for name in unlinked:
              print(f"  - {name}")
          PY

      # The script dual-writes the registry (data/ + public/data/). Commit both
      # copies so the deployed site and the repo source stay in sync. Deployment
      # itself is owned by deploy.yml, which rebuilds via workflow_run on this
      # workflow's completion (GITHUB_TOKEN pushes do not fire push events).
      - name: Commit updated ecosystem-registry.json if changed
        run: |
          git config user.name "assessment-models-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ecosystem-registry.json public/data/ecosystem-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(registry): sync Assessment-Models catalog [skip ci]"
            git push
          else
            echo "No catalog changes detected."
          fi