name: Sync Assessment-Models Ecosystem Registry

on:
  push:
    # Verify the sync liveness whenever its logic changes (runs the real sync
    # in CI and commits any registry drift; bot commits use [skip ci] so no
    # recursion). User pushes fire this trigger — GITHUB_TOKEN pushes do not.
    branches: [main]
    paths:
      - "scripts/sync_org_catalog.py"
      - ".github/workflows/sync-catalog.yml"
  schedule:
    # Sync every 6 hours to keep GitHub Pages aligned with org repositories
    - cron: "0 */6 * * *"
  repository_dispatch:
    # Triggered by model repositories upon release or manifest update
    types: [model-released, manifest-updated]
  workflow_dispatch:
    # Manual refresh button in GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: "catalog-sync"
  cancel-in-progress: true

jobs:
  sync-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assessment-models.github.io
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: pip install --quiet jsonschema

      - name: Synchronize Assessment-Models repository catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_org_catalog.py

      # Coverage guardrail: surface every discovered repository, its layer,
      # version and manifest status so repos still missing an
      # assessment-manifest.json (or contracts) are immediately visible.
      - name: Print catalog coverage summary
        run: |
          python - <<'PY'
          import json

          with open("data/ecosystem-registry.json", encoding="utf-8") as fh:
              registry = json.load(fh)

          artifacts = registry.get("artifacts", [])
          endpoint_ids = {
              ep
              for key in ("touchpoints", "handshakes")
              for contract in registry.get(key, [])
              for ep in (contract.get("from_station_id"), contract.get("to_station_id"))
          }
          print(f"Coverage summary: {len(artifacts)} artifacts mapped\n")
          unmanifested, unlinked = [], []
          for art in artifacts:
              has_manifest = bool(art.get("has_manifest"))
              linked = art.get("id") in endpoint_ids
              flag = "manifest" if has_manifest else "NO-MANIFEST"
              link_flag = "contracts" if linked else "NO-CONTRACTS"
              print(f"  {art['full_name']:<58} {art.get('layer', '?'):<20} "
                    f"{art.get('version', '?'):<14} {flag} {link_flag} ({art.get('conformance_status', '?')})")
              if not has_manifest:
                  unmanifested.append(art["full_name"])
              if not linked:
                  unlinked.append(art["full_name"])

          print(f"\nRepos needing assessment-manifest.json: {len(unmanifested)}")
          for name in unmanifested:
              print(f"  - {name}")
          print(f"Repos needing touchpoints/handshakes: {len(unlinked)}")
          for name in unlinked:
              print(f"  - {name}")
          PY

      # The script dual-writes the registry (data/ + public/data/). Commit both
      # copies so the deployed site and the repo source stay in sync. Deployment
      # itself is owned by deploy.yml, which rebuilds via workflow_run on this
      # workflow's completion (GITHUB_TOKEN pushes do not fire push events).
      - name: Commit updated ecosystem-registry.json if changed
        run: |
          git config user.name "assessment-models-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ecosystem-registry.json public/data/ecosystem-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(registry): sync Assessment-Models catalog [skip ci]"
            git push
          else
            echo "No catalog changes detected."
          fi